<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project Letterbox</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<audio id="music">
    <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<div class="background">

    <div class="paper">

        <div class="title">

            <h2>A Special</h2>

            <h1>Delivery</h1>

            <div class="divider"></div>

            <p class="subtitle">
                A little surprise is waiting for you
            </p>

        </div>

        <div class="mailbox">

            <div class="mailbox-top"></div>

            <div class="mail-slot"></div>

            <div id="envelope">

                ✉️

            </div>

        </div>

        <button id="openButton">

            Tap to Open Mail

        </button>

        <p class="sound">

            ♪ Please ensure your sound is on

        </p>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
