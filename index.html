<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Special Delivery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<audio id="music" preload="auto">
    <source src="assets/Screen_Recording_20260719_204357_One UI Home.mp3" type="audio/mpeg">
</audio>

<div class="paper">

    <div class="mailbox-area">

        <img
        id="mailbox"
        src="assets/mailbox.svg"
        alt="English Mailbox">

        <img
        id="envelope"
        src="assets/envelope.svg"
        alt="Envelope">

    </div>

    <div class="text">

        <h1 id="message">
            A special delivery has arrived...
        </h1>

        <p id="open">
            Tap to Open Mail
        </p>

    </div>

</div>

<script>

const music=document.getElementById("music");

document.getElementById("open").addEventListener("click",openInvitation);
document.getElementById("mailbox").addEventListener("click",openInvitation);
document.getElementById("envelope").addEventListener("click",openInvitation);

function openInvitation(){

music.play();

document.body.classList.add("opening");

setTimeout(()=>{

window.location.href="https://zoeblaze.my.canva.site/borntoblaze";

},1800);

}

</script>

</body>
</html>
